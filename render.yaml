services:
  - type: web
    name: my-blog
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # Renderが割り当てるURLを後で設定
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: my-blog-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
    preDeployCommand: php artisan migrate --force

databases:
  - name: my-blog-db
    plan: free
