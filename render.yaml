services:
  - type: web
    name: my-blog-app
    env: php
    plan: free
    buildCommand: |
      composer install --no-dev
      npm install && npm run build
      php artisan optimize
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
